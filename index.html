<!doctype html>
<html lang="bn">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Roadmap Hub — সব কোর্স এক জায়গায়</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #0a0d13;
				--bg-raised: #10141c;
				--card: #12161f;
				--card-border: #232a38;
				--ink: #e7eaf0;
				--ink-dim: #97a1b4;
				--ink-faint: #5c6579;
				--violet: #8b7cff;
				--violet-dim: #4e4590;
				--amber: #ffb454;
				--amber-dim: #6b5730;
				--green: #6fd9a7;
				--rose: #ff7c9c;
				--blue: #6fb6ff;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font-family: 'Hind Siliguri', 'Space Grotesk', sans-serif;
				line-height: 1.7;
				-webkit-font-smoothing: antialiased;
			}

			::selection {
				background: var(--violet-dim);
				color: #fff;
			}

			.wrap {
				max-width: 1080px;
				margin: 0 auto;
				padding: 0 32px;
			}

			@media (max-width: 640px) {
				.wrap {
					padding: 0 18px;
				}
			}

			/* ---- header ---- */
			header.hero {
				padding: 68px 0 44px;
				border-bottom: 1px solid var(--card-border);
			}

			.hero-kicker {
				font-family: 'JetBrains Mono', monospace;
				font-size: 12.5px;
				color: var(--amber);
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 20px;
			}

			.hero-kicker .dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--green);
				box-shadow: 0 0 0 3px rgba(111, 217, 167, 0.15);
			}

			h1 {
				font-family: 'Space Grotesk', sans-serif;
				font-weight: 600;
				font-size: clamp(30px, 4.6vw, 46px);
				line-height: 1.16;
				letter-spacing: -0.01em;
				margin: 0 0 18px;
			}

			h1 em {
				font-style: normal;
				color: var(--amber);
			}

			.hero-lede {
				font-size: 17px;
				color: var(--ink-dim);
				max-width: 64ch;
				margin: 0;
			}

			.stat-row {
				display: flex;
				gap: 0;
				margin-top: 36px;
				border-top: 1px solid var(--card-border);
				flex-wrap: wrap;
			}

			.stat {
				padding: 16px 26px 0 0;
				margin-right: 26px;
				border-right: 1px solid var(--card-border);
			}

			.stat:last-child {
				border-right: none;
			}

			.stat .n {
				font-family: 'JetBrains Mono', monospace;
				font-size: 26px;
				font-weight: 600;
				color: var(--violet);
			}

			.stat .l {
				font-size: 12.5px;
				color: var(--ink-faint);
				margin-top: 2px;
			}

			/* ---- filter ---- */
			.filter-row {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				padding: 28px 0 6px;
			}

			.filter-chip {
				font-family: 'JetBrains Mono', monospace;
				font-size: 12.5px;
				border: 1px solid var(--card-border);
				color: var(--ink-dim);
				padding: 6px 13px;
				border-radius: 999px;
				cursor: pointer;
				background: transparent;
				transition: all 0.15s ease;
			}

			.filter-chip:hover {
				border-color: var(--violet);
				color: var(--ink);
			}

			.filter-chip.active {
				border-color: var(--amber);
				color: var(--amber);
				background: rgba(255, 180, 84, 0.08);
			}

			/* ---- grid ---- */
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
				gap: 18px;
				padding: 22px 0 70px;
			}

			.roadmap-card {
				position: relative;
				border: 1px solid var(--card-border);
				border-radius: 5px;
				background: var(--card);
				padding: 22px 22px 20px;
				display: flex;
				flex-direction: column;
				text-decoration: none;
				color: inherit;
				transition:
					border-color 0.18s ease,
					transform 0.18s ease;
				overflow: hidden;
			}

			.roadmap-card::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 2px;
				background: var(--accent, var(--violet));
			}

			.roadmap-card:hover {
				border-color: var(--accent, var(--violet));
				transform: translateY(-2px);
			}

			.roadmap-card.disabled {
				opacity: 0.5;
				cursor: default;
			}

			.roadmap-card.disabled:hover {
				transform: none;
				border-color: var(--card-border);
			}

			.card-top {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 10px;
				margin-bottom: 14px;
			}

			.card-icon {
				width: 38px;
				height: 38px;
				border-radius: 6px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: 'JetBrains Mono', monospace;
				font-weight: 600;
				font-size: 13px;
				border: 1px solid var(--accent, var(--violet));
				color: var(--accent, var(--violet));
				flex-shrink: 0;
			}

			.card-status {
				font-family: 'JetBrains Mono', monospace;
				font-size: 10.5px;
				letter-spacing: 0.03em;
				padding: 3px 9px;
				border-radius: 999px;
				border: 1px solid var(--card-border);
				color: var(--ink-faint);
				white-space: nowrap;
			}

			.card-status.ready {
				color: var(--green);
				border-color: #2d5f47;
			}

			.card-status.soon {
				color: var(--ink-faint);
			}

			.card-title {
				font-family: 'Space Grotesk', sans-serif;
				font-size: 18px;
				font-weight: 600;
				margin: 0 0 8px;
				letter-spacing: -0.005em;
			}

			.card-desc {
				font-size: 14px;
				color: var(--ink-dim);
				margin: 0 0 18px;
				flex: 1;
			}

			.card-meta {
				display: flex;
				align-items: center;
				gap: 14px;
				padding-top: 14px;
				border-top: 1px solid var(--card-border);
				font-family: 'JetBrains Mono', monospace;
				font-size: 11.5px;
				color: var(--ink-faint);
			}

			.card-meta span {
				display: flex;
				align-items: center;
				gap: 5px;
			}

			.card-meta svg {
				width: 13px;
				height: 13px;
				opacity: 0.8;
			}

			.card-cta {
				margin-top: 16px;
				display: flex;
				align-items: center;
				gap: 8px;
				font-family: 'JetBrains Mono', monospace;
				font-size: 13px;
				color: var(--accent, var(--violet));
			}

			/* ---- add-new note ---- */
			.add-note {
				border: 1px dashed var(--card-border);
				border-radius: 5px;
				padding: 22px;
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				color: var(--ink-faint);
				font-size: 13.5px;
			}

			.add-note b {
				color: var(--ink-dim);
				font-family: 'Space Grotesk', sans-serif;
				font-weight: 600;
				display: block;
				margin-bottom: 8px;
				font-size: 15px;
			}

			.add-note code {
				font-family: 'JetBrains Mono', monospace;
				font-size: 12px;
				color: var(--amber);
				background: #1a2130;
				padding: 1.5px 6px;
				border-radius: 3px;
			}

			footer {
				border-top: 1px solid var(--card-border);
				padding: 26px 0 50px;
				color: var(--ink-faint);
				font-size: 13px;
				font-family: 'JetBrains Mono', monospace;
			}
		</style>
	</head>

	<body>
		<div class="wrap">
			<header class="hero">
				<div class="hero-kicker"><span class="dot"></span>ROADMAP HUB</div>
				<h1>সব শেখার <em>রোডম্যাপ</em> এক জায়গায়।</h1>
				<p class="hero-lede">
					নিচে সব বাংলা কোর্স রোডম্যাপের তালিকা — প্রতিটাতে ক্লিক করলে
					দিন-ভিত্তিক (day-wise) পুরো কোর্স খুলবে, যেখান থেকে প্রতিটা দিনের
					কনটেন্ট কপি করা যায়।
				</p>
				<div class="stat-row" id="statRow"></div>
			</header>

			<div class="filter-row" id="filterRow"></div>

			<div class="grid" id="grid"></div>

			<footer>
				Roadmap Hub · সব কোর্স একই ফোল্ডারে রাখলে লিঙ্কগুলো কাজ করবে।
			</footer>
		</div>

		<script>
			/* ============================================================
       একটা নতুন রোডম্যাপ যোগ করতে চাইলে নিচের অ্যারেতে একটা object
       বসিয়ে দিন — কার্ড আর ফিল্টার এমনিই তৈরি হয়ে যাবে।
       status: "ready" (লিংক কাজ করবে) অথবা "soon" (কার্ড disabled থাকবে)
       ============================================================ */
			const roadmaps = [
				{
					id: 'k6',
					title: 'k6 Load Testing',
					tag: 'Performance / DevOps',
					icon: 'k6',
					accent: '#FFB454',
					desc: '৩০ দিনে শূন্য থেকে প্রোডাকশন পর্যন্ত — script লেখা থেকে scenario, threshold, Grafana monitoring ও CI/CD gate পর্যন্ত।',
					days: 30,
					weeks: 4,
					level: 'Beginner → Advanced',
					href: 'k6-load-testing-30-day-bangla-course.html',
					status: 'ready',
				},
				// পরবর্তী রোডম্যাপ এখানে যোগ করুন, যেমন:
				// {
				//   id: 'docker',
				//   title: 'Docker & Containers',
				//   tag: 'DevOps',
				//   icon: 'DK',
				//   accent: '#6FB6FF',
				//   desc: 'কন্টেইনার বেসিক থেকে প্রোডাকশন ডিপ্লয়মেন্ট পর্যন্ত।',
				//   days: 21,
				//   weeks: 3,
				//   level: 'Beginner',
				//   href: 'docker-21-day-bangla-course.html',
				//   status: 'soon'
				// },
			];

			const categories = ['সব', ...new Set(roadmaps.map((r) => r.tag))];

			function iconSvg() {
				return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 11-14h-7z"/></svg>`;
			}
			function calSvg() {
				return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
			}
			function layersSvg() {
				return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>`;
			}

			function renderStats() {
				const total = roadmaps.length;
				const totalDays = roadmaps.reduce((a, r) => a + r.days, 0);
				const ready = roadmaps.filter((r) => r.status === 'ready').length;
				document.getElementById('statRow').innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">রোডম্যাপ</div></div>
    <div class="stat"><div class="n">${totalDays}</div><div class="l">মোট দিন</div></div>
    <div class="stat"><div class="n">${ready}</div><div class="l">এখন উপলব্ধ</div></div>
  `;
			}

			function renderFilters(active) {
				const row = document.getElementById('filterRow');
				row.innerHTML = categories
					.map(
						(c) =>
							`<button class="filter-chip ${c === active ? 'active' : ''}" data-cat="${c}">${c}</button>`
					)
					.join('');
				row.querySelectorAll('.filter-chip').forEach((btn) => {
					btn.addEventListener('click', () => renderGrid(btn.dataset.cat));
				});
				const rows = row.querySelectorAll('.filter-chip');
			}

			function renderGrid(activeCat) {
				activeCat = activeCat || 'সব';
				renderFilters(activeCat);
				const list =
					activeCat === 'সব'
						? roadmaps
						: roadmaps.filter((r) => r.tag === activeCat);
				const grid = document.getElementById('grid');

				const cards = list
					.map((r) => {
						const tag = r.status === 'ready' ? 'a' : 'div';
						const hrefAttr = r.status === 'ready' ? `href="${r.href}"` : '';
						const statusLabel = r.status === 'ready' ? 'উপলব্ধ' : 'শীঘ্রই আসছে';
						const statusClass = r.status === 'ready' ? 'ready' : 'soon';
						return `
    <${tag} class="roadmap-card ${r.status !== 'ready' ? 'disabled' : ''}" style="--accent:${r.accent}" ${hrefAttr}>
      <div class="card-top">
        <div class="card-icon">${r.icon}</div>
        <div class="card-status ${statusClass}">${statusLabel}</div>
      </div>
      <h2 class="card-title">${r.title}</h2>
      <p class="card-desc">${r.desc}</p>
      <div class="card-meta">
        <span>${calSvg()} ${r.days} দিন</span>
        <span>${layersSvg()} ${r.weeks} সপ্তাহ</span>
      </div>
      ${r.status === 'ready' ? `<div class="card-cta">${iconSvg()} কোর্স শুরু করুন</div>` : ''}
    </${tag}>`;
					})
					.join('');

				grid.innerHTML = cards;
			}

			renderStats();
			renderGrid('সব');
		</script>
	</body>
</html>
